
name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: [17]

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bookingDb
          MYSQL_USER: user
          MYSQL_PASSWORD: 123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: ${{matrix.java}}
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package
      env:
        SPRING_DATASOURCE_URL: jdbc:mariadb://localhost:3306/bookingDb?createDatabaseIfNotExist=true
        SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USERNAME }}
        SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}
#    - name: Build with Maven
#      run: mvn -B package -DiskTests
    - name: Login to Dockerhub
      run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "hdvere" --password-stdin
    - name: build image
      run: |
        docker build -t  hdvere/bookingservice:latest .

    - name: push to docker hub
      run: |
        docker push  hdvere/bookingservice:latest
